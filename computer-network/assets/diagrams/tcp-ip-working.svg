<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">TCP/IP working across a routed network</title>
  <desc id="description">A browser on a client sends an HTTPS request to a web server. Application and transport are end-to-end, IP is forwarded by routers, and a fresh link frame and physical signal carry the packet on each hop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#d8e4f0"/></marker>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59d6e8"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}
      .title{font-size:48px;font-weight:700;fill:#f5f7fb}
      .sub{font-size:23px;fill:#aebed0}
      .head{font-size:23px;font-weight:700;fill:#f6f8fc}
      .body{font-size:20px;fill:#e0e8f2}
      .small{font-size:17px;fill:#aebed0}
      .tag{font-size:18px;font-weight:700;fill:#08151d}
      .app{fill:#194461;stroke:#4db7f2}
      .transport{fill:#603942;stroke:#ff8f9b}
      .internet{fill:#635036;stroke:#ffc477}
      .link{fill:#315747;stroke:#8fe0a9}
      .physical{fill:#453b66;stroke:#ba9ef5}
      .layer{stroke-width:2}
      .path{stroke:#d8e4f0;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .logical{stroke:#59d6e8;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#cyanArrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#0b1420"/>
  <text x="70" y="78" class="title">TCP/IP: one request, several layers</text>
  <text x="70" y="116" class="sub">Example: a browser requests a page from a web server over HTTPS</text>

  <text x="88" y="188" class="head">Client endpoint</text>
  <text x="1210" y="188" class="head">Server endpoint</text>
  <text x="610" y="188" class="head">Network devices</text>

  <!-- Endpoint stacks. The arrows between them show conceptual communication, not a bypass around routers. -->
  <g>
    <rect x="75" y="215" width="310" height="58" rx="12" class="layer app"/>
    <text x="98" y="251" class="body">Application · HTTP request</text>
    <rect x="75" y="283" width="310" height="58" rx="12" class="layer transport"/>
    <text x="98" y="319" class="body">Transport · TCP :443</text>
    <rect x="75" y="351" width="310" height="58" rx="12" class="layer internet"/>
    <text x="98" y="387" class="body">Internet · IP packet</text>
    <rect x="75" y="419" width="310" height="58" rx="12" class="layer link"/>
    <text x="98" y="455" class="body">Data link · local frame</text>
    <rect x="75" y="487" width="310" height="58" rx="12" class="layer physical"/>
    <text x="98" y="523" class="body">Physical · signals</text>
    <path d="M230 273V283M230 341V351M230 409V419M230 477V487" class="path"/>
  </g>
  <g>
    <rect x="1205" y="215" width="310" height="58" rx="12" class="layer app"/>
    <text x="1228" y="251" class="body">Application · web service</text>
    <rect x="1205" y="283" width="310" height="58" rx="12" class="layer transport"/>
    <text x="1228" y="319" class="body">Transport · TCP :443</text>
    <rect x="1205" y="351" width="310" height="58" rx="12" class="layer internet"/>
    <text x="1228" y="387" class="body">Internet · IP packet</text>
    <rect x="1205" y="419" width="310" height="58" rx="12" class="layer link"/>
    <text x="1228" y="455" class="body">Data link · local frame</text>
    <rect x="1205" y="487" width="310" height="58" rx="12" class="layer physical"/>
    <text x="1228" y="523" class="body">Physical · signals</text>
    <path d="M1360 487V477M1360 419V409M1360 351V341M1360 283V273" class="path"/>
  </g>

  <path d="M385 244H1205" class="logical"/>
  <text x="609" y="234" class="small">logical application conversation (end to end)</text>
  <path d="M385 312H1205" class="logical"/>
  <text x="681" y="302" class="small">TCP connection (end to end)</text>
  <path d="M385 380H585M1025 380H1205" class="logical"/>
  <text x="685" y="370" class="small">IP forwarded by routers</text>

  <!-- Physical topology. Switches forward frames within their LAN; routers build the next link's frame. -->
  <rect x="90" y="620" width="165" height="74" rx="15" class="layer physical"/>
  <text x="130" y="665" class="body">Client</text>
  <rect x="332" y="620" width="165" height="74" rx="15" class="layer link"/>
  <text x="370" y="665" class="body">Switch A</text>
  <rect x="574" y="620" width="165" height="74" rx="15" class="layer internet"/>
  <text x="615" y="665" class="body">Router A</text>
  <rect x="816" y="620" width="165" height="74" rx="15" class="layer internet"/>
  <text x="857" y="665" class="body">Router B</text>
  <rect x="1058" y="620" width="165" height="74" rx="15" class="layer link"/>
  <text x="1096" y="665" class="body">Switch B</text>
  <rect x="1300" y="620" width="165" height="74" rx="15" class="layer physical"/>
  <text x="1340" y="665" class="body">Server</text>
  <path d="M255 657H332M497 657H574M739 657H816M981 657H1058M1223 657H1300" class="path"/>
  <text x="126" y="732" class="small">Host</text>
  <text x="360" y="732" class="small">Local LAN</text>
  <text x="596" y="732" class="small">First gateway</text>
  <text x="836" y="732" class="small">Next network</text>
  <text x="1082" y="732" class="small">Server LAN</text>
  <text x="1330" y="732" class="small">Host</text>

  <rect x="75" y="775" width="1440" height="88" rx="16" fill="#162635" stroke="#37516a" stroke-width="2"/>
  <text x="100" y="810" class="head">At each router:</text>
  <text x="100" y="843" class="body">Remove incoming frame → inspect destination IP → choose next hop → create a new outgoing frame.</text>
</svg>
